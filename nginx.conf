server {
  charset utf-8;
  charset_types text/plain text/css application/javascript application/json text/xml application/xml;
  listen 80;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;
  # Redirecciones relativas (detrás del proxy de Dokploy el puerto interno no debe aparecer en la URL)
  absolute_redirect off;

  # Sitio anterior: /sobre-mi ahora es /jorge-sanchez (Google aún la muestra); la lista /proyectos va a la portada.
  location = /sobre-mi { return 301 /jorge-sanchez; }
  location = /contacto { return 301 /#contacto; }
  location = /servicios { return 301 /desarrollador-full-stack-barranquilla; }
  location = /proyectos { return 301 /#proyectos; }
  # Blog y casos volvieron. Un artículo o caso viejo que ya no existe va a su índice (301) en vez de a un 404.
  location /blog/ { try_files $uri $uri.html $uri/index.html @blog_viejo; }
  location @blog_viejo { return 301 /blog; }
  location /proyectos/ { try_files $uri $uri.html $uri/index.html @caso_viejo; }
  location @caso_viejo { return 301 /#proyectos; }

  # Me gusta y comentarios del blog: los atiende el servidor de Astro (node:sqlite) dentro del mismo contenedor
  location /api/ {
    proxy_pass http://127.0.0.1:4321;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    client_max_body_size 16k;
  }

  gzip on;
  gzip_types text/plain text/css application/javascript application/json application/xml image/svg+xml;
  gzip_min_length 512;

  # Sin barra final (trailingSlash: 'never'): /pagina sirve /pagina.html o /pagina/index.html
  location / {
    try_files $uri $uri.html $uri/index.html =404;
  }

  # Archivos con hash: caché de un año
  location /_astro/ {
    add_header Cache-Control "public, max-age=31536000, immutable";
    # Clarity (mapas de calor y grabaciones) descarga el CSS y las fuentes desde clarity.ms
    add_header Access-Control-Allow-Origin "*";
    try_files $uri =404;
  }

  location ~* \.(woff2|svg|ico|png|jpe?g|webp|avif)$ {
    add_header Cache-Control "public, max-age=604800";
    add_header Access-Control-Allow-Origin "*";
    try_files $uri =404;
  }

  add_header X-Content-Type-Options nosniff always;
  add_header Referrer-Policy strict-origin-when-cross-origin always;

  error_page 404 /404.html;
}
